<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio visualization</title>
    <meta name="description" content="A particle cloud that morphs between a sphere, a box and a heart in time with the music.">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff717e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230000ff'/%3E%3C/svg%3E">
    <link rel="preload" href="assets/audio/song.mp3" as="fetch" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="scene"></canvas>

<div class="song-progress-container">
    <progress id="progress" value="0" max="1"></progress>
</div>

<div class="buttons-bg">
    <button id="play-toggle" class="icon-play" type="button" aria-label="Play" disabled></button>
</div>

<p id="status" class="status">Loading the track&hellip;</p>

<div class="about-container">
    <div>song: Riptide</div>
    <div>musician: Vance Joy</div>
    <div>dev: Vid Repar</div>
    <div>github: <a href="https://github.com/vidrepar/audio-visualizer">github.com/vidrepar/audio-visualizer</a></div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
