<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio visualization</title>
    <meta name="description" content="Paste a YouTube link and watch a particle cloud move to it.">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff717e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230000ff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="scene"></canvas>

<div class="song-progress-container">
    <progress id="progress" value="0" max="1"></progress>
</div>

<div id="launcher" class="launcher">
    <form id="url-form" class="launcher-form" autocomplete="off">
        <input id="url-input" type="text" placeholder="paste a youtube link" aria-label="YouTube link" spellcheck="false" autofocus>
        <button type="submit" aria-label="Load">&rarr;</button>
    </form>

    <p id="now-playing" class="now-playing" hidden></p>

    <p id="message" class="message" hidden></p>

    <p class="secondary">
        <button id="enable-audio" type="button" class="link-button" hidden>let it hear the music</button>
        <button id="use-mic" type="button" class="link-button" hidden>listen through the microphone</button>
        <button id="use-demo" type="button" class="link-button">try the demo</button>
        <span class="separator">·</span>
        <input id="file-input" type="file" accept="audio/*">
        <label class="link-button" for="file-input">open a file</label>
    </p>
</div>

<div id="youtube-host" class="youtube-host" hidden></div>

<div class="buttons-bg">
    <button id="play-toggle" class="icon-play" type="button" aria-label="Play" hidden></button>
</div>

<div class="about-container">
    <a href="https://github.com/vidrepar/audio-visualizer">github.com/vidrepar/audio-visualizer</a>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
